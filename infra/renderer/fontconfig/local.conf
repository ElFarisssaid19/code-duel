<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Code Duel renderer: the only installed fonts are DejaVu. Map every generic family to it so a
     page asking for "Arial", "serif" or "monospace" always gets the same glyphs. -->
<fontconfig>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Serif</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>cursive</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>fantasy</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
