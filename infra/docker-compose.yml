name: code-duel

services:
  mysql:
    image: mysql:8.4
    container_name: code-duel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (see infra/.env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: UTC
    ports:
      # Bound to localhost only; change to "${MYSQL_PORT}:3306" to expose on the LAN.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so the check stays red while the init-only
      # (socket-only) server is running on first boot.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Code execution sandbox (https://github.com/criyle/go-judge). See infra/go-judge/.
  go-judge:
    build: ./go-judge
    image: code-duel-go-judge:v1.14.1
    container_name: code-duel-go-judge
    restart: unless-stopped
    # Required by go-judge: user programs run in nested containers (namespaces + cgroup v2).
    privileged: true
    # go-judge keeps its file store in /dev/shm.
    shm_size: 256m
    environment:
      ES_HTTP_ADDR: ':5050'
      ES_RELEASE: 'true'
      ES_SILENT: 'true'
      # Safety net: cached files expire even if the server never deletes them.
      ES_FILE_TIMEOUT: '10m'
    ports:
      # Never expose this outside localhost: anyone who can reach it can run code.
      - '127.0.0.1:${JUDGE_PORT:-5050}:5050'
    healthcheck:
      # The image has no curl; node is already there for user code.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5050/version').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Renders untrusted HTML/CSS with Chromium (JavaScript and network disabled) and scores it
  # against target images. Node 24 slim + Playwright's Chromium headless shell only. See
  # infra/renderer/.
  renderer:
    build: ./renderer
    image: code-duel-renderer:1.65.0
    container_name: code-duel-renderer
    restart: unless-stopped
    environment:
      PORT: '5070'
    ports:
      # Never expose this outside localhost: it renders untrusted code.
      - '127.0.0.1:${RENDERER_PORT:-5070}:5070'
    # Hardening: read-only root FS (Chromium writes its profile to the /tmp tmpfs), no Linux
    # capabilities, no privilege escalation, and hard resource limits.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5070/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
    name: code-duel-mysql-data
