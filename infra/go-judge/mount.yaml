# Sandbox filesystem for user code. Based on go-judge's default mount.yaml
# (https://docs.goj.ac/mount), trimmed to what Node.js and Python need.
# Everything from the image is read-only; only /w (work dir) and /tmp are writable tmpfs.
mount:
  - type: bind
    source: /bin
    target: /bin
    readonly: true
  - type: bind
    source: /lib
    target: /lib
    readonly: true
  - type: bind
    source: /lib64
    target: /lib64
    readonly: true
  - type: bind
    source: /usr
    target: /usr
    readonly: true
  - type: bind
    source: /etc/ld.so.cache
    target: /etc/ld.so.cache
    readonly: true
  # A fixed passwd file: the sandbox never sees the host's (or the image's) users.
  - type: bind
    source: /opt/passwd
    target: /etc/passwd
    readonly: true
  - type: bind
    source: /dev/null
    target: /dev/null
  # node wants /dev/urandom
  - type: bind
    source: /dev/urandom
    target: /dev/urandom
  - type: bind
    source: /dev/random
    target: /dev/random
  - type: bind
    source: /dev/zero
    target: /dev/zero
  # work dir
  - type: tmpfs
    target: /w
    data: size=64m,nr_inodes=4k
  # tmp dir
  - type: tmpfs
    target: /tmp
    data: size=64m,nr_inodes=4k
proc: true
symLink:
  - linkPath: /dev/fd
    target: /proc/self/fd
  - linkPath: /dev/stdin
    target: /proc/self/fd/0
  - linkPath: /dev/stdout
    target: /proc/self/fd/1
  - linkPath: /dev/stderr
    target: /proc/self/fd/2
maskPath:
  - /sys/firmware
  - /sys/devices/virtual/powercap
  - /proc/acpi
  - /proc/asound
  - /proc/kcore
  - /proc/keys
  - /proc/latency_stats
  - /proc/timer_list
  - /proc/timer_stats
  - /proc/sched_debug
  - /proc/scsi
workDir: /w
hostName: go-judge
domainName: go-judge
uid: 1536
gid: 1536
